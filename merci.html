<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Merci · Musubi Dojo Jurbise</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="images/favicon.ico" sizes="any"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;600&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
 font-family:'Inter',sans-serif;color:#f7f1e6;
 background:radial-gradient(120% 120% at 80% 0%,#33261a 0%,transparent 55%),linear-gradient(160deg,#1b1611,#17130d 60%,#0f0c08)}
.k{position:fixed;right:-4vw;top:50%;transform:translateY(-50%);font-family:'Noto Serif JP',serif;font-size:min(58vw,700px);color:rgba(195,48,37,.1);pointer-events:none}
.card{position:relative;z-index:2;max-width:560px}
img.logo{width:88px;height:88px;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.5);margin-bottom:26px}
.lbl{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:#b08d57;margin-bottom:12px}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,6vw,3.6rem);font-weight:700;line-height:1.05;margin-bottom:18px}
h1 em{font-style:normal;color:#c33025}
p{color:rgba(247,241,230,.82);font-size:1.1rem;font-weight:300;margin-bottom:32px}
a.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:999px;background:#c33025;color:#fff;text-decoration:none;font-weight:600;transition:.28s}
a.btn:hover{background:#9c231b;transform:translateY(-3px)}
</style>
</head>
<body>
<div class="k" aria-hidden="true">結</div>
<div class="card">
  <img class="logo" src="images/logo.png" alt="Musubi Dojo"/>
  <p class="lbl">Musubi Dojo Jurbise</p>
  <h1>Merci !<br>Message <em>envoyé.</em></h1>
  <p>Votre message est bien parti. Nous vous répondrons dès que possible. Au plaisir de vous accueillir sur le tatami.</p>
  <a class="btn" href="index.html">Retour au site</a>
</div>
</body>
</html>
